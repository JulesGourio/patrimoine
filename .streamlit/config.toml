[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1d4ed8"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7fb"
textColor = "#111827"
borderColor = "#e5e7eb"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "0.6rem"
showWidgetBorder = true
greenColor = "#15803d"
redColor = "#b91c1c"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948", "#8a8983"]
dataframeHeaderBackgroundColor = "#f5f7fb"

[theme.sidebar]
backgroundColor = "#f5f7fb"
