<title>Patrimoine v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout : trois écrans de téléphone côte à côte, chacun déroulé en entier ; ils s'empilent sur petit écran. */
:root{
  --stage:#DFE2E8; --bg:#F3F4F7; --card:#FFFFFF; --ink:#0E1320; --sub:#5A6272; --mute:#6F7787; --line:#E9EBF0; --chip:#ECEEF2;
  --night:#0E1320; --night2:#1A2132; --night-line:#252D40; --night-sub:#9CA5B8;
  --up:#087F54; --down:#C7382F; --up-n:#4ADE9A; --down-n:#FF8D83;
  --c1:#2A78D6; --c2:#EB6834; --c3:#1BAF7A; --c4:#EDA100; --c5:#6250D6; --c6:#9AA3B5;
  --accent:#2A78D6;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--stage);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.35;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.stage{display:flex;flex-wrap:wrap;gap:36px;justify-content:center;align-items:flex-start;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{width:390px;max-width:100%;display:flex;flex-direction:column;gap:10px}
.col>h2{margin:0;font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.02em}
.phone{background:var(--bg);border-radius:34px;overflow:hidden;box-shadow:0 1px 0 #fff inset,0 18px 40px -18px rgba(14,19,32,.35);display:flex;flex-direction:column}
.scr{padding:18px 16px 20px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.top h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
.icons{display:flex;gap:6px}
.ib{width:40px;height:40px;border-radius:20px;border:0;background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.ib.pri{background:var(--ink);color:#fff}
.ib svg{width:20px;height:20px}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chip{flex:none;height:36px;padding:0 13px;border-radius:18px;border:0;background:var(--card);color:var(--sub);font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;cursor:pointer}
.chip i{width:8px;height:8px;border-radius:4px;display:block}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}

.hero{background:var(--night);color:#fff;border-radius:24px;padding:18px 0 12px;display:flex;flex-direction:column;gap:12px}
.hero .pad{padding:0 18px}
.eyebrow{font-size:12px;font-weight:500;color:var(--night-sub)}
.big{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.big small{font-size:22px;font-weight:600;letter-spacing:-.01em;color:var(--night-sub)}
.delta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:14px;font-weight:600;margin-top:6px}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:8px;font-weight:600;font-size:13px}
.hero .pill.up{background:rgba(74,222,154,.14);color:var(--up-n)} .hero .pill.down{background:rgba(255,141,131,.14);color:var(--down-n)}
.pill.up{background:#E3F4EC;color:var(--up)} .pill.down{background:#FBE9E7;color:var(--down)}
.hero .when{color:var(--night-sub);font-weight:500;font-size:13px}
.herohead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.seg{display:flex;background:var(--night2);border-radius:10px;padding:3px;gap:2px}
.seg button{height:28px;min-width:34px;padding:0 9px;border:0;border-radius:8px;background:transparent;color:var(--night-sub);font-size:12px;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink)}
.seg.light{background:var(--chip)} .seg.light button{color:var(--sub)} .seg.light button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(14,19,32,.12)}
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto}
.periods{display:flex;gap:2px;padding:0 12px}
.periods button{flex:1;height:34px;border:0;border-radius:10px;background:transparent;color:var(--night-sub);font-size:12px;font-weight:600;cursor:pointer}
.periods button[aria-pressed=true]{background:var(--night2);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--night-sub);padding:0 18px}
.legend span{display:flex;align-items:center;gap:6px} .legend b{color:#fff;font-weight:600}
.legend i{width:10px;height:3px;border-radius:2px;display:block}
.card .legend{padding:0;color:var(--sub)} .card .legend b{color:var(--ink)}

.card{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
.ch h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.ch .more{font-size:13px;font-weight:600;color:var(--accent);background:none;border:0;padding:6px 0;cursor:pointer}
.ch .aside{font-size:12px;color:var(--mute);font-weight:500}

.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:14px;overflow:hidden}
.k{background:var(--card);padding:12px 12px 12px 0;display:flex;flex-direction:column;gap:3px}
.k:nth-child(even){padding-left:14px;padding-right:0}
.k span{font-size:12px;color:var(--mute);font-weight:500}
.k b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.k em{font-style:normal;font-size:12px;font-weight:500;color:var(--mute)}
.up{color:var(--up)} .down{color:var(--down)}

.wf{display:flex;flex-direction:column;gap:9px}
.wfr{display:grid;grid-template-columns:140px 1fr 66px;align-items:center;gap:10px;font-size:13px}
.wfr .t{color:var(--sub)} .wfr .v{text-align:right;font-weight:600}
.wfr .b{height:10px;position:relative}
.wfr .b::before{content:"";position:absolute;left:var(--z);top:-4px;bottom:-4px;width:1px;background:var(--line)}
.wfr .b i{position:absolute;top:0;height:10px;border-radius:3px;display:block}
.wfr.tot{border-top:1px solid var(--line);padding-top:10px;font-weight:600} .wfr.tot .t{color:var(--ink)} .wfr.tot .v{font-size:15px}

.tm{position:relative;height:200px;border-radius:12px;overflow:hidden}
.tm div{position:absolute;padding:8px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;border:1px solid var(--card);border-radius:6px}
.tm b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm span{font-size:12px;font-weight:600}

.row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.row:first-child{border-top:0;padding-top:0} .row:last-child{padding-bottom:0}
.av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.nm{display:flex;flex-direction:column;min-width:0}
.nm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv{display:flex;flex-direction:column;align-items:flex-end;min-width:74px}
.rv b{font-weight:600} .rv span{font-size:12px;font-weight:600}
.row.r4{grid-template-columns:36px minmax(0,1fr) 54px auto}
.list{display:flex;flex-direction:column}

.mg{display:grid;grid-template-columns:36px repeat(12,1fr) 52px;gap:3px;align-items:center;font-size:11px;color:var(--mute)}
.mg .c{height:22px;border-radius:5px} .mg .y{font-weight:600;color:var(--ink);font-size:12px} .mg .tt{text-align:right;font-weight:600;font-size:12px}
.mg .mh{text-align:center}
.pair{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)} .pair b{color:var(--ink);font-weight:600}

.bars{display:flex;flex-direction:column;gap:11px}
.br{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;font-size:13px}
.br .n{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0} .br .n i{flex:none;width:8px;height:8px;border-radius:3px;display:block}
.br .v{font-weight:600;text-align:right} .br .v em{font-style:normal;font-weight:500;color:var(--mute);margin-right:6px}
.br .tr{grid-column:1/-1;height:6px;border-radius:3px;background:var(--chip);position:relative}
.br .tr i{position:absolute;left:0;top:0;height:6px;border-radius:3px;display:block}
.br .tr u{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink);border-radius:1px}

.split{display:flex;height:12px;gap:2px;border-radius:6px;overflow:hidden} .split i{display:block;height:12px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.trio>div{display:flex;flex-direction:column;gap:3px;padding:0 0 0 14px;border-left:1px solid var(--night-line)}
.trio>div:first-child{padding-left:0;border-left:0}
.trio span{font-size:12px;color:var(--night-sub);font-weight:500}
.trio b{font-size:21px;font-weight:700;letter-spacing:-.02em}
.trio em{font-style:normal;font-size:12px;font-weight:600}
.op{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.op:first-child{border-top:0;padding-top:0} .op:last-child{padding-bottom:0}
.op .amt{font-weight:600}
.month{display:flex;align-items:center;gap:2px;font-weight:600;font-size:14px}
.month button{width:36px;height:36px;border:0;background:none;font-size:18px;color:var(--sub);cursor:pointer}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:8px 6px 14px;margin-top:8px}
.tabs div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--mute);padding:4px 0}
.tabs div.on{color:var(--ink);font-weight:600}
.tabs svg{width:22px;height:22px}
.tip{position:absolute;top:0;transform:translateX(-50%);background:#fff;color:var(--ink);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip span{color:var(--sub);font-weight:500;margin-left:6px}
@media (prefers-reduced-motion:no-preference){.chip,.seg button,.periods button{transition:background .15s,color .15s}}
</style>

<main class="stage">
  <div class="col"><h2>Bourse</h2><section class="phone"><div class="scr" id="bourse"></div><div class="tabs" data-on="1"></div></section></div>
  <div class="col"><h2>Revenus et dépenses</h2><section class="phone"><div class="scr" id="flux"></div><div class="tabs" data-on="2"></div></section></div>
  <div class="col"><h2>Patrimoine</h2><section class="phone"><div class="scr" id="patri"></div><div class="tabs" data-on="0"></div></section></div>
</main>

<script>
(function(){
"use strict";
var NB=' ';
function sp(n,d){var s=Math.abs(n).toFixed(d||0).split('.');s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,NB);return s.join(',');}
function eur(n,d){return (n<0?'−':'')+sp(n,d)+NB+'€';}
function sg(n,d){return (n<0?'−':'+')+sp(n,d)+NB+'€';}
function pc(x,d){return (x<0?'−':'+')+sp(x,d===undefined?2:d)+NB+'%';}
function cls(n){return n<0?'down':'up';}
function arr(n){return n<0?'▼':'▲';}
function rng(seed){var s=seed;return function(){s=(s*48271)%2147483647;return s/2147483647;};}
function bridge(seed,n){var r=rng(seed),w=[0],i,o=[];for(i=1;i<n;i++)w.push(w[i-1]+r()-0.5);for(i=0;i<n;i++)o.push(w[i]-w[n-1]*i/(n-1));return o;}
function $(id){return document.getElementById(id);}
function mix(a,b,t){function h(c,i){return parseInt(c.substr(1+i*2,2),16);}var o='#',i,v;for(i=0;i<3;i++){v=Math.round(h(a,i)+(h(b,i)-h(a,i))*t);o+=('0'+v.toString(16)).slice(-2);}return o;}
function heat(p,cap){var t=Math.min(1,Math.abs(p)/cap);t=0.18+0.82*t;return {bg:mix('#EEF0F3',p<0?'#C7382F':'#087F54',t),fg:t>0.55?'#fff':'#0E1320'};}
var MO=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
var ICON={
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
 gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>'
};
var TABS=[['Patrimoine','<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>'],['Bourse','<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>'],['Flux','<path d="M7 4v14M7 18l-3-3M7 18l3-3M17 20V6M17 6l-3 3M17 6l3 3"/>'],['Projection','<path d="M4 20h16M6 16l4-5 3 3 5-8"/>']];
Array.prototype.forEach.call(document.querySelectorAll('.tabs'),function(t){var on=+t.dataset.on;t.innerHTML=TABS.map(function(x,i){return '<div class="'+(i===on?'on':'')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+x[1]+'</svg>'+x[0]+'</div>';}).join('');});

/* ---------- Bourse ---------- */
var P=['1J','1S','1M','3M','YTD','1A','MAX'];
var CAP=["aujourd'hui",'7 jours','1 mois','3 mois','depuis le 1er janv.','1 an',"depuis l'origine"];
var SPAN=[0,7,30,91,315,365,730];
var ACC=[
 {id:'pea',n:'PEA',c:'#2A78D6',dep:[0,0,200,600,2200,2400,1e9],tri:11.2,vol:11.8,dd:-8.1,real:0,fees:-12,cap:6.2},
 {id:'cto',n:'Compte-titres',c:'#EB6834',dep:[0,0,300,600,2500,3000,1e9],tri:-13.4,vol:24.6,dd:-31.7,real:-95,fees:-29,cap:9},
 {id:'es',n:'Épargne salariale',c:'#1BAF7A',dep:[0,0,0,0,3000,3000,1e9],tri:7.1,vol:21.3,dd:-18.9,real:0,fees:0,cap:8}
];
var ALL={tri:0.9,vol:14.2,dd:-12.4};
var POS=[
 {n:'Altair Groupe',k:'AL',a:'es',q:109.4,v:14625,g:1840,p:[0.72,-2.19,0.19,6.5,-13.35,-1.5],sec:'Industrie',pays:'France',dev:'EUR',cl:'Actions',div:219,col:'#3B4A6B'},
 {n:'ETF Monde',k:'EM',a:'pea',q:69.75,v:7046,g:1224,p:[-0.82,0.95,0.18,5.78,18.68,23.84],sec:'Diversifié',pays:'Monde',dev:'EUR',cl:'ETF',div:94,col:'#2A78D6'},
 {n:'Nimbus Compute',k:'NC',a:'cto',q:11.78,v:4331,g:-2224,p:[0.48,-0.79,-7.2,-23.61,-20.69,-32.93],sec:'Technologie',pays:'États-Unis',dev:'USD',cl:'Actions',div:0,col:'#6250D6'},
 {n:'Aérostar Industries',k:'AI',a:'cto',q:14.38,v:1845,g:281,p:[-1.86,1.49,14.33,-13.36,11.06,3.6],sec:'Industrie',pays:'Allemagne',dev:'EUR',cl:'Actions',div:38,col:'#0E8A8A'},
 {n:'Solvéo Énergie',k:'SE',a:'cto',q:25.11,v:1428,g:-200,p:[0.26,0,-12.86,-14.98,-16.8,-10.68],sec:'Énergie',pays:'France',dev:'EUR',cl:'Actions',div:61,col:'#C98500'},
 {n:'Helix Santé',k:'HS',a:'cto',q:12.86,v:1379,g:-390,p:[1.96,-2.43,-14.78,-38.01,-32.86,-36.25],sec:'Santé',pays:'États-Unis',dev:'USD',cl:'Actions',div:0,col:'#D55181'}
];
var IDX=[-0.82,0.95,0.18,5.78,18.68,23.84,31.2];
var S={period:'1J',account:'all',mode:'eur',sort:'var',alloc:'a',hover:null};
var N=64,W=354,H=170,T=10,B=150;
function ppct(q,pi){return pi===6?q.g/(q.v-q.g)*100:q.p[pi];}
function pdel(q,pi){var r=ppct(q,pi)/100;return q.v-q.v/(1+r);}
function accSeries(acc,ai,pi){
 var V=0,D=0,G=0,dv=0,i,t,val=[],inv=[];
 POS.forEach(function(q){if(q.a===acc.id){V+=q.v;G+=q.g;D+=pdel(q,pi);dv+=q.div;}});
 var cost=V-G,dep=Math.min(acc.dep[pi],cost),start=Math.max(0,V-D-dep);
 var b=bridge(1000+ai*77+pi*13,N),amp=V*0.009*[0.25,0.5,1,1.6,2.5,3,3.5][pi];
 for(i=0;i<N;i++){t=i/(N-1);val.push(Math.max(0,start+(V-start)*t+amp*b[i]*(pi===6?t:1)));inv.push(cost-dep+dep*t);}
 return {V:V,D:D,G:G,cost:cost,val:val,inv:inv,div:dv};
}
function pts(a,lo,hi){return a.map(function(v,i){return [(i/(a.length-1))*(W-8),B-((v-lo)/((hi-lo)||1))*(B-T)];});}
function dOf(p){return p.map(function(q,i){return (i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1);}).join(' ');}
function labelAt(pi,t){
 if(pi===0){var m=540+Math.round(510*t);return Math.floor(m/60)+' h '+('0'+m%60).slice(-2);}
 var d=new Date(2026,10,12);d.setDate(d.getDate()-Math.round(SPAN[pi]*(1-t)));
 return d.getDate()+' '+MO[d.getMonth()]+(pi>=5?' '+d.getFullYear():'');
}
function renderBourse(){
 var pi=P.indexOf(S.period),ser=ACC.map(function(a,i){return accSeries(a,i,pi);});
 var sel=[];ACC.forEach(function(a,i){if(S.account==='all'||S.account===a.id)sel.push(i);});
 var V=0,D=0,G=0,cost=0,div=0,real=0,fees=0,tot=[],inv=[],i;
 for(i=0;i<N;i++){tot.push(0);inv.push(0);}
 sel.forEach(function(x){var s=ser[x];V+=s.V;D+=s.D;G+=s.G;cost+=s.cost;div+=s.div;real+=ACC[x].real;fees+=ACC[x].fees;for(i=0;i<N;i++){tot[i]+=s.val[i];inv[i]+=s.inv[i];}});
 var R=D/(V-D)*100,idx=IDX[pi],one=sel.length===1?ACC[sel[0]]:null;
 var kp=one||ALL;
 var svg='',legend='',hov=[],lo,hi,main;
 var grid='<path d="M0 '+T+'H'+W+'M0 '+((T+B)/2)+'H'+W+'M0 '+B+'H'+W+'" stroke="#252D40" stroke-width="1"/>';
 if(S.mode==='pct'){
  var b1=bridge(500+pi*31+sel.length*7+sel[0],N),b2=bridge(900+pi*17,N),pf=[],ix=[],a2=Math.max(0.35*[0.25,0.5,1,1.6,2.5,3,3.5][pi],Math.abs(R)*0.09,Math.abs(idx)*0.09);
  for(i=0;i<N;i++){var t=i/(N-1);pf.push(R*t+a2*b1[i]*(1-t*0.0));ix.push(idx*t+a2*0.7*b2[i]);}
  pf[N-1]=R;ix[N-1]=idx;
  lo=Math.min.apply(null,pf.concat(ix));hi=Math.max.apply(null,pf.concat(ix));var pd=(hi-lo)*0.1||0.1;lo-=pd;hi+=pd;
  var zy=B-((0-lo)/(hi-lo))*(B-T);
  main=pts(pf,lo,hi);
  svg=grid+'<path d="M0 '+zy.toFixed(1)+'H'+W+'" stroke="#3A445C" stroke-width="1" stroke-dasharray="2 3"/><path d="'+dOf(pts(ix,lo,hi))+'" fill="none" stroke="#9CA5B8" stroke-width="1.6"/><path d="'+dOf(main)+'" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>';
  legend='<span><i style="background:#fff"></i>Portefeuille <b>'+pc(R)+'</b></span><span><i style="background:#9CA5B8"></i>Indice monde <b>'+pc(idx)+'</b></span>';
