name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "patrimoine/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "patrimoine/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CFFI_VERSION: "2.1.1"
  LIBFFI_VERSION: "3.4.6"

jobs:
  # curl_cffi (Yahoo, Trade Republic, Senate site) publishes Android wheels but needs cffi 2.x, which does not.
  # Build it once with cibuildwheel (the standard tool for Android wheels) and keep it in the cache.
  cffi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: wheels
          key: cffi-${{ env.CFFI_VERSION }}-ffi-${{ env.LIBFFI_VERSION }}-cp313-android-arm64-v1
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # cffi links libffi; Chaquopy's Python has no libffi.so to share, so link a static one into _cffi_backend.
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build libffi (static) for Android
        run: |
          curl -sSL -o libffi.tar.gz "https://github.com/libffi/libffi/releases/download/v${LIBFFI_VERSION}/libffi-${LIBFFI_VERSION}.tar.gz"
          tar xzf libffi.tar.gz
          TC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cd "libffi-${LIBFFI_VERSION}"
          ./configure --host=aarch64-linux-android --prefix="$GITHUB_WORKSPACE/ffi" --libdir="$GITHUB_WORKSPACE/ffi/lib" \
            --disable-shared --enable-static --with-pic --disable-docs --disable-multi-os-directory \
            CC="$TC/aarch64-linux-android24-clang" AR="$TC/llvm-ar" RANLIB="$TC/llvm-ranlib"
          make -j4 install
          ls -R "$GITHUB_WORKSPACE/ffi" | head -30
          PKG_CONFIG_PATH="$GITHUB_WORKSPACE/ffi/lib/pkgconfig" pkg-config --cflags --libs libffi
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build cffi for Android
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: cp313-*
          CIBW_ARCHS: arm64_v8a
          CIBW_BUILD_VERBOSITY: 1
          # cffi asks pkg-config for libffi: point it at the static Android build above.
          PKG_CONFIG_PATH: ${{ github.workspace }}/ffi/lib/pkgconfig
          CIBW_ENVIRONMENT_PASS_LINUX: PKG_CONFIG_PATH
          CIBW_ENVIRONMENT: PKG_CONFIG_PATH="${{ github.workspace }}/ffi/lib/pkgconfig"
        run: |
          python -m pip install "cibuildwheel==4.3.4"
          python -m pip download --no-binary :all: --no-deps "cffi==${CFFI_VERSION}" -d src
          tar xzf "src/cffi-${CFFI_VERSION}.tar.gz" -C src
          python -m cibuildwheel "src/cffi-${CFFI_VERSION}" --output-dir wheels
          ls -l wheels
      - uses: actions/upload-artifact@v4
        with:
          name: cffi-android
          path: wheels/*.whl

  apk:
    needs: cffi
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Chaquopy compiles the Python sources and runs pip with a Python of the same version as the app's.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: cffi-android
          path: android/app/wheels
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: patrimoine-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
