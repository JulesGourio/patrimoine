[project]
name = "patrimoine"
version = "0.1.0"
description = "Suivi local des dépenses, du portefeuille et du patrimoine (CMB, Trade Republic, PEG Airbus)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "keyring>=25",
    "python-dotenv>=1.0",
    "pytr>=0.4.10",
    "tzdata>=2026.4",
    "yfinance>=1.7.0",
    "pyjwt[crypto]>=2.15.0",
    "requests>=2.34.2",
    "streamlit>=1.57",
    "plotly>=7.1.0",
    "mcp>=2.2",
    "markdown>=3.11",
    "pypdf>=6.19.0",
]

[project.scripts]
patrimoine = "patrimoine.cli:main"
patrimoine-mcp = "patrimoine.mcp_server:main"
patrimoine-sync = "patrimoine.pipeline:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patrimoine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
